<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ShortsOff</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>ShortsOff</h1>

    <label class="switch-row">
      <span class="label-text">Block Shorts</span>
      <input
        type="checkbox"
        id="toggle"
        role="switch"
        aria-label="Block Shorts"
      >
    </label>

    <p class="hint">Only affects youtube.com</p>

    <script src="popup.js"></script>
  </body>
</html>
